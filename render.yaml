services:
  - type: web
    name: hanpyo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: TRUST_PROXY
        value: "1"
